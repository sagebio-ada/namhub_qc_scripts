name: Publish py-dcqc images to GHCR

# For each directory in PY_DCQC_DIRS, each subdirectory with a Dockerfile is built and pushed to GHCR.
# Full releases also get the "latest" tag. Pre-releases do not.
# Docker image names:
# - ghcr.io/sage-bionetworks/namhub_qc_scripts/<folder_name>:<release_tag>
# - example: ghcr.io/sage-bionetworks/namhub_qc_scripts/matrix_content_qc:v0.1.0


on:
  release:
    types: [published]

permissions:
  contents: read

env:
  # One directory on each line. Each subdirectory with a Dockerfile
  # becomes one image.
  PY_DCQC_DIRS: |
    scrnaseq_qc_pipeline/checks/py_dcqc

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.find.outputs.checks }}
      image_prefix: ${{ steps.find.outputs.image_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find check folders
        id: find
        run: |
          # If a directory has no Dockerfiles, skip it. Do not loop over
          # the literal glob pattern.
          shopt -s nullglob
          checks='[]'
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            for dockerfile in "$dir"/*/Dockerfile; do
              name="$(basename "$(dirname "$dockerfile")")"
              # Most images build from the repo root because they import
              # qc_common/. matrix_content_qc builds from scrnaseq_qc_pipeline/
              # (see the header of its Dockerfile).
              case "$name" in
                matrix_content_qc) context=scrnaseq_qc_pipeline ;;
                *) context=. ;;
              esac
              checks="$(jq -c --arg n "$name" --arg f "$dockerfile" --arg c "$context" \
                '. + [{name: $n, file: $f, context: $c}]' <<< "$checks")"
            done
          done <<< "$PY_DCQC_DIRS"
          echo "Found: $checks"
          if [ "$checks" = '[]' ]; then
            echo "No Dockerfiles found in any of these directories:" >&2
            echo "$PY_DCQC_DIRS" >&2
            exit 1
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          # GHCR image names must be lowercase.
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.checks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kraken2_qc is ~17GB (the Kraken2 database is baked in). The default
      # runner does not have enough free disk for it without this cleanup.
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker image prune -af || true
          docker builder prune -af || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.discover.outputs.image_prefix }}/${{ matrix.check.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push ${{ matrix.check.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.check.context }}
          file: ${{ matrix.check.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
